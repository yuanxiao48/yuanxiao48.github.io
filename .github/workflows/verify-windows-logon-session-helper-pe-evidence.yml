name: Verify Windows Helper PE Evidence

on:
  push:
    branches:
      - verify/4a3-real-helper-bff3f755

permissions:
  contents: read

jobs:
  native-x64-msvc-pe-evidence:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify event identity
        shell: pwsh
        run: |
          Write-Output "github.repository=${{ github.repository }}"
          Write-Output "github.ref=${{ github.ref }}"
          Write-Output "github.sha=${{ github.sha }}"
          Write-Output "github.event_name=${{ github.event_name }}"
          Write-Output "runner.os=${{ runner.os }}"
          Write-Output "runner.arch=${{ runner.arch }}"
          if ('${{ github.ref }}' -ne 'refs/heads/verify/4a3-real-helper-bff3f755') { throw 'unexpected ref' }
          if ('${{ github.event_name }}' -ne 'push') { throw 'unexpected event' }

      - name: Prepare isolated temporary directories
        shell: pwsh
        run: |
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $build = [IO.Path]::GetFullPath((Join-Path $runnerTemp 'studio-4a3-c2a-build'))
          $evidence = [IO.Path]::GetFullPath((Join-Path $runnerTemp 'studio-4a3-c2a-evidence'))
          foreach ($directory in @($build, $evidence)) {
            if (-not $directory.StartsWith($runnerTemp + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'temporary directory escape' }
            if (Test-Path -LiteralPath $directory) { Remove-Item -LiteralPath $directory -Recurse -Force }
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
          }
          "BUILD_DIRECTORY=$build" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "EVIDENCE_DIRECTORY=$evidence" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run JavaScript source and fake tests
        shell: pwsh
        run: |
          node --check scripts/normalize-windows-logon-session-helper-pe-evidence.mjs
          node --check scripts/test-windows-logon-session-helper-pe-evidence.mjs
          node --check scripts/test-windows-logon-session-helper-pe-evidence-workflow-source-contract.mjs
          node --check shared/windows-logon-session-real-validator.mjs
          node --check scripts/validate-windows-logon-session-helper-real.mjs
          node --check scripts/test-windows-logon-session-real-validator.mjs
          node --check scripts/test-windows-logon-session-real-validator-source-contract.mjs
          node scripts/test-windows-logon-session-helper-pe-evidence.mjs
          node scripts/test-windows-logon-session-helper-pe-evidence-workflow-source-contract.mjs
          node scripts/test-windows-logon-session-helper-source-contract.mjs
          node scripts/test-windows-logon-session-real-validator.mjs
          node scripts/test-windows-logon-session-real-validator-source-contract.mjs
          node scripts/test-windows-logon-session-snapshot-protocol.mjs
          node scripts/test-windows-logon-session-snapshot-runner.mjs
          node scripts/test-windows-logon-session-liveness-provider.mjs
          node scripts/test-host-execution-containment-comparison.mjs
          node scripts/test-windows-logon-session-liveness-evidence.mjs

      - name: Configure and build exact native targets
        shell: pwsh
        run: |
          $build = $env:BUILD_DIRECTORY
          & cmake -S native/windows-logon-session-snapshot-helper -B $build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMAKE_CONFIGURE_FAILED' }
          & cmake --build $build --config Release --target windows_logon_session_protocol
          if ($LASTEXITCODE -ne 0) { throw 'CMAKE_PROTOCOL_BUILD_FAILED' }
          & cmake --build $build --config Release --target windows-logon-session-snapshot-protocol-test
          if ($LASTEXITCODE -ne 0) { throw 'CMAKE_PROTOCOL_TEST_BUILD_FAILED' }
          & cmake --build $build --config Release --target windows-logon-session-snapshot-helper
          if ($LASTEXITCODE -ne 0) { throw 'CMAKE_HELPER_BUILD_FAILED' }

      - name: Run pure native protocol test and locate helper
        shell: pwsh
        run: |
          $build = $env:BUILD_DIRECTORY
          $protocolTests = @(Get-ChildItem -LiteralPath $build -Recurse -File -Filter 'windows-logon-session-snapshot-protocol-test.exe')
          if ($protocolTests.Count -ne 1 -or (($protocolTests[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) { throw 'protocol test location invalid' }
          $protocolTest = $protocolTests[0]
          & $protocolTest.FullName
          if ($LASTEXITCODE -ne 0) { throw 'protocol test failed' }
          $helpers = @(Get-ChildItem -LiteralPath $build -Recurse -File -Filter 'windows-logon-session-snapshot-helper.exe')
          if ($helpers.Count -ne 1 -or (($helpers[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) -or $helpers[0].Length -le 0 -or $helpers[0].Length -gt (16 * 1024 * 1024)) { throw 'helper location invalid' }
          $helperCanonical = (Resolve-Path -LiteralPath $helpers[0].FullName).Path
          if (-not $helperCanonical.StartsWith([IO.Path]::GetFullPath($build) + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'helper canonical path invalid' }
          "HELPER_FILE=$helperCanonical" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Collect static PE evidence without executing helper
        shell: pwsh
        run: |
          $helper = Get-Item -LiteralPath $env:HELPER_FILE
          $helperSize = $helper.Length
          $runnerTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path
          $build = (Resolve-Path -LiteralPath $env:BUILD_DIRECTORY).Path
          $evidence = (Resolve-Path -LiteralPath $env:EVIDENCE_DIRECTORY).Path
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          $expectedCommit = $env:GITHUB_SHA
          if ([string]::IsNullOrWhiteSpace($expectedCommit) -or $expectedCommit -cnotmatch '^[a-f0-9]{40}$') { throw 'GITHUB_SHA_INVALID' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'vswhere unavailable' }
          $vsInstallation = @(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $vsInstallation.Count -ne 1 -or [string]::IsNullOrWhiteSpace($vsInstallation[0])) { throw 'Visual Studio unavailable' }
          $vsRoot = (Resolve-Path -LiteralPath $vsInstallation[0].Trim()).Path
          $vsDevCmd = Join-Path $vsRoot 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) { throw 'VsDevCmd unavailable' }
          $vsDevCmd = (Resolve-Path -LiteralPath $vsDevCmd).Path
          if (-not $vsDevCmd.StartsWith($vsRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'VsDevCmd unavailable' }
          $environmentLines = cmd.exe /d /s /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'VsDevCmd failed' }
          foreach ($line in $environmentLines) {
            $separator = $line.IndexOf('=')
            if ($separator -gt 0) { Set-Item -LiteralPath ("Env:" + $line.Substring(0, $separator)) -Value $line.Substring($separator + 1) }
          }
          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
          $dumpbin = (Resolve-Path -LiteralPath $dumpbin).Path
          $dumpbinItem = Get-Item -LiteralPath $dumpbin
          if (-not $dumpbin.StartsWith($vsRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase) -or (($dumpbinItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) -or $dumpbinItem.PSIsContainer) { throw 'dumpbin origin invalid' }
          $maxDumpbinStdoutBytes = 8MB
          $maxDumpbinStderrBytes = 1MB
          $maxNormalizerStdoutBytes = 256KB
          $maxNormalizerStderrBytes = 1MB
          function Invoke-DumpbinEvidence([string]$switch, [string]$name) {
            $stdoutPath = Join-Path $evidence ($name + '.stdout.txt')
            $stderrPath = Join-Path $evidence ($name + '.stderr.txt')
            & $dumpbin $switch $helper.FullName 1> $stdoutPath 2> $stderrPath
            $exitCode = $LASTEXITCODE
            return [PSCustomObject]@{ Name = $name; StdoutPath = $stdoutPath; StderrPath = $stderrPath; ExitCode = $exitCode }
          }
          $dumpbinResults = @(
            Invoke-DumpbinEvidence '/headers' 'headers'
            Invoke-DumpbinEvidence '/dependents' 'dependents'
            Invoke-DumpbinEvidence '/imports' 'imports'
            Invoke-DumpbinEvidence '/loadconfig' 'loadconfig'
          )
          $userProfile = $null
          if (-not [string]::IsNullOrWhiteSpace($env:USERPROFILE)) {
            try { $userProfile = (Resolve-Path -LiteralPath $env:USERPROFILE -ErrorAction Stop).Path } catch { throw 'USERPROFILE_UNAVAILABLE' }
          }
          function Test-AbsolutePathResidue([string]$text) {
            if ($null -eq $text) { return $false }
            $driveRooted = '(?<![A-Za-z0-9+.\-])[A-Za-z]:[\\/]'
            $backslashUnc = '\\\\[^\\/\r\n]+[\\/]'
            $forwardUnc = '(?<!:)(?<![A-Za-z0-9+.\-])//[^/\r\n]+/'
            return [regex]::IsMatch($text, $driveRooted, [Text.RegularExpressions.RegexOptions]::IgnoreCase) -or [regex]::IsMatch($text, $backslashUnc, [Text.RegularExpressions.RegexOptions]::IgnoreCase) -or [regex]::IsMatch($text, $forwardUnc, [Text.RegularExpressions.RegexOptions]::IgnoreCase)
          }
          function Assert-PathResidueDetector {
            foreach ($value in @('C:\secret\helper.pdb', 'D:/secret/helper.pdb', '"E:\folder\file.obj"', '\\server\share\helper.pdb', '//server/share/helper.pdb')) { if (-not (Test-AbsolutePathResidue $value)) { throw 'PATH_RESIDUE_DETECTOR_SELF_TEST_FAILED' } }
            foreach ($value in @('https://example.com/path', 'http://example.com/path', 'ftp://example.com/path', '8664 machine (x64)', 'Guard Flags: 500', 'KERNEL32.dll', '<RUNNER_TEMP>\build\helper.pdb', '<VISUAL_STUDIO>/VC/Tools/dumpbin.exe')) { if (Test-AbsolutePathResidue $value) { throw 'PATH_RESIDUE_DETECTOR_SELF_TEST_FAILED' } }
          }
          Assert-PathResidueDetector
          $powershellSha256 = (Get-FileHash -LiteralPath $helper.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($powershellSha256 -notmatch '^[a-f0-9]{64}$') { throw 'POWERSHELL_SHA256_INVALID' }
          function Replace-LiteralPathInsensitive([string]$text, [string]$needle, [string]$replacement) {
            if ([string]::IsNullOrWhiteSpace($needle)) { return $text }
            return [regex]::Replace($text, [regex]::Escape($needle), $replacement, [Text.RegularExpressions.RegexOptions]::IgnoreCase)
          }
          function Get-VerifiedToolOutputFile([string]$path, [bool]$allowEmpty, [Int64]$maximumBytes, [string]$invalidCode, [string]$tooLargeCode) {
            try {
              $item = Get-Item -LiteralPath $path -Force -ErrorAction Stop
              if ($item.PSIsContainer -or (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) -or $item.Length -lt 0) { throw $invalidCode }
              $canonicalPath = (Resolve-Path -LiteralPath $item.FullName -ErrorAction Stop).Path
              if (-not $canonicalPath.StartsWith($evidence + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw $invalidCode }
              if ($item.Length -gt $maximumBytes) { throw $tooLargeCode }
              if (-not $allowEmpty -and $item.Length -eq 0) { throw $invalidCode }
              return $canonicalPath
            } catch {
              if ($_.Exception.Message -eq $invalidCode -or $_.Exception.Message -eq $tooLargeCode) { throw $_.Exception.Message }
              throw $invalidCode
            }
          }
          function Read-BoundedToolOutput([string]$path, [bool]$allowEmpty, [Int64]$maximumBytes, [string]$invalidCode, [string]$tooLargeCode, [string]$readCode) {
            $canonicalPath = Get-VerifiedToolOutputFile $path $allowEmpty $maximumBytes $invalidCode $tooLargeCode
            $stream = $null; $memory = $null
            try {
              $stream = [IO.FileStream]::new($canonicalPath, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
              $memory = [IO.MemoryStream]::new()
              $buffer = [byte[]]::new(65536)
              while (($read = $stream.Read($buffer, 0, $buffer.Length)) -gt 0) {
                if (($memory.Length + [Int64]$read) -gt $maximumBytes) { throw $tooLargeCode }
                $memory.Write($buffer, 0, $read)
              }
              $bytes = $memory.ToArray()
              if (-not $allowEmpty -and $bytes.Length -eq 0) { throw $invalidCode }
              try { return [Text.UTF8Encoding]::new($false, $true).GetString($bytes) } catch { throw $readCode }
            } catch {
              if ($_.Exception.Message -eq $invalidCode -or $_.Exception.Message -eq $tooLargeCode -or $_.Exception.Message -eq $readCode) { throw $_.Exception.Message }
              throw $readCode
            } finally {
              if ($null -ne $memory) { $memory.Dispose() }
              if ($null -ne $stream) { $stream.Dispose() }
            }
          }
          function Protect-ToolOutput([string]$text, [string]$residueCode) {
            $replacements = @(
              @{ needle = $helper.FullName; replacement = 'windows-logon-session-snapshot-helper.exe' },
              @{ needle = $build; replacement = '<RUNNER_TEMP>' },
              @{ needle = $evidence; replacement = '<RUNNER_TEMP>' },
              @{ needle = $runnerTemp; replacement = '<RUNNER_TEMP>' },
              @{ needle = $workspace; replacement = '<GITHUB_WORKSPACE>' },
              @{ needle = $vsRoot; replacement = '<VISUAL_STUDIO>' },
              @{ needle = $userProfile; replacement = '<USERPROFILE>' }
            )
            foreach ($entry in $replacements) { $text = Replace-LiteralPathInsensitive $text $entry.needle $entry.replacement }
            foreach ($entry in $replacements) { if (-not [string]::IsNullOrWhiteSpace($entry.needle) -and $text.IndexOf($entry.needle, [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw $residueCode } }
            if (Test-AbsolutePathResidue $text) { throw $residueCode }
            return $text
          }
          $dumpbinOutputCodes = @{
            HEADERS = @{ Exit = 'DUMPBIN_HEADERS_FAILED'; StdoutInvalid = 'HEADERS_STDOUT_INVALID'; StdoutTooLarge = 'HEADERS_STDOUT_TOO_LARGE'; StdoutRead = 'HEADERS_STDOUT_READ_FAILED'; StderrInvalid = 'HEADERS_STDERR_INVALID'; StderrTooLarge = 'HEADERS_STDERR_TOO_LARGE'; StderrRead = 'HEADERS_STDERR_READ_FAILED'; StderrNonEmpty = 'DUMPBIN_HEADERS_STDERR_NONEMPTY' }
            DEPENDENTS = @{ Exit = 'DUMPBIN_DEPENDENTS_FAILED'; StdoutInvalid = 'DEPENDENTS_STDOUT_INVALID'; StdoutTooLarge = 'DEPENDENTS_STDOUT_TOO_LARGE'; StdoutRead = 'DEPENDENTS_STDOUT_READ_FAILED'; StderrInvalid = 'DEPENDENTS_STDERR_INVALID'; StderrTooLarge = 'DEPENDENTS_STDERR_TOO_LARGE'; StderrRead = 'DEPENDENTS_STDERR_READ_FAILED'; StderrNonEmpty = 'DUMPBIN_DEPENDENTS_STDERR_NONEMPTY' }
            IMPORTS = @{ Exit = 'DUMPBIN_IMPORTS_FAILED'; StdoutInvalid = 'IMPORTS_STDOUT_INVALID'; StdoutTooLarge = 'IMPORTS_STDOUT_TOO_LARGE'; StdoutRead = 'IMPORTS_STDOUT_READ_FAILED'; StderrInvalid = 'IMPORTS_STDERR_INVALID'; StderrTooLarge = 'IMPORTS_STDERR_TOO_LARGE'; StderrRead = 'IMPORTS_STDERR_READ_FAILED'; StderrNonEmpty = 'DUMPBIN_IMPORTS_STDERR_NONEMPTY' }
            LOADCONFIG = @{ Exit = 'DUMPBIN_LOADCONFIG_FAILED'; StdoutInvalid = 'LOADCONFIG_STDOUT_INVALID'; StdoutTooLarge = 'LOADCONFIG_STDOUT_TOO_LARGE'; StdoutRead = 'LOADCONFIG_STDOUT_READ_FAILED'; StderrInvalid = 'LOADCONFIG_STDERR_INVALID'; StderrTooLarge = 'LOADCONFIG_STDERR_TOO_LARGE'; StderrRead = 'LOADCONFIG_STDERR_READ_FAILED'; StderrNonEmpty = 'DUMPBIN_LOADCONFIG_STDERR_NONEMPTY' }
          }
          $dumpbinResidueCodes = @{ HEADERS = 'HEADERS_PATH_RESIDUE'; DEPENDENTS = 'DEPENDENTS_PATH_RESIDUE'; IMPORTS = 'IMPORTS_PATH_RESIDUE'; LOADCONFIG = 'LOADCONFIG_PATH_RESIDUE' }
          $protectedStdout = @{}; $protectedStderr = @{}
          foreach ($result in $dumpbinResults) {
            $key = $result.Name.ToUpperInvariant()
            $codes = $dumpbinOutputCodes[$key]
            $protectedStdout[$key] = Protect-ToolOutput (Read-BoundedToolOutput $result.StdoutPath $false $maxDumpbinStdoutBytes $codes.StdoutInvalid $codes.StdoutTooLarge $codes.StdoutRead) $dumpbinResidueCodes[$key]
            $protectedStderr[$key] = Protect-ToolOutput (Read-BoundedToolOutput $result.StderrPath $true $maxDumpbinStderrBytes $codes.StderrInvalid $codes.StderrTooLarge $codes.StderrRead) $dumpbinResidueCodes[$key]
          }
          foreach ($result in $dumpbinResults) { $key = $result.Name.ToUpperInvariant(); $codes = $dumpbinOutputCodes[$key]; if ($result.ExitCode -ne 0) { throw $codes.Exit }; if ($protectedStderr[$key].Length -ne 0) { throw $codes.StderrNonEmpty } }
          function Write-RedactedEvidence([string]$name, [string]$text) {
            Write-Output "=== BEGIN DUMPBIN $name ==="
            Write-Output $text
            Write-Output "=== END DUMPBIN $name ==="
          }
          Write-RedactedEvidence 'HEADERS' $protectedStdout.HEADERS
          Write-RedactedEvidence 'DEPENDENTS' $protectedStdout.DEPENDENTS
          Write-RedactedEvidence 'IMPORTS' $protectedStdout.IMPORTS
          Write-RedactedEvidence 'LOADCONFIG' $protectedStdout.LOADCONFIG
          $normalizerStdoutPath = Join-Path $evidence 'normalizer.stdout.txt'
          $normalizerStderrPath = Join-Path $evidence 'normalizer.stderr.txt'
          & node scripts/normalize-windows-logon-session-helper-pe-evidence.mjs --helper $helper.FullName --headers (Join-Path $evidence 'headers.stdout.txt') --dependents (Join-Path $evidence 'dependents.stdout.txt') --imports (Join-Path $evidence 'imports.stdout.txt') --loadconfig (Join-Path $evidence 'loadconfig.stdout.txt') --source-commit $expectedCommit --expected-powershell-sha256 $powershellSha256 1> $normalizerStdoutPath 2> $normalizerStderrPath
          $normalizerExitCode = $LASTEXITCODE
          $normalizerStdout = Protect-ToolOutput (Read-BoundedToolOutput $normalizerStdoutPath $true $maxNormalizerStdoutBytes 'NORMALIZER_STDOUT_INVALID' 'NORMALIZER_STDOUT_TOO_LARGE' 'NORMALIZER_STDOUT_READ_FAILED') 'NORMALIZER_STDOUT_PATH_RESIDUE'
          $normalizerStderr = Protect-ToolOutput (Read-BoundedToolOutput $normalizerStderrPath $true $maxNormalizerStderrBytes 'NORMALIZER_STDERR_INVALID' 'NORMALIZER_STDERR_TOO_LARGE' 'NORMALIZER_STDERR_READ_FAILED') 'NORMALIZER_STDERR_PATH_RESIDUE'
          function Assert-NormalizerFailureJson([string]$jsonText, [Int32]$expectedExitCode) {
            $document = $null
            try {
              try { $document = [System.Text.Json.JsonDocument]::Parse($jsonText) } catch { throw 'NORMALIZER_FAILURE_JSON_INVALID' }
              $jsonRoot = $document.RootElement
              if ($jsonRoot.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) { throw 'NORMALIZER_FAILURE_JSON_INVALID' }
              $expectedProperties = [string[]]@('status', 'code')
              $expectedPropertySet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
              $seenProperties = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
              foreach ($propertyName in $expectedProperties) { [void]$expectedPropertySet.Add($propertyName) }
              $propertyCount = 0
              foreach ($property in $jsonRoot.EnumerateObject()) {
                $propertyCount += 1
                if (-not $expectedPropertySet.Contains($property.Name) -or -not $seenProperties.Add($property.Name)) { throw 'NORMALIZER_FAILURE_JSON_INVALID' }
              }
              if ($propertyCount -ne $expectedProperties.Length -or -not $seenProperties.Contains('status') -or -not $seenProperties.Contains('code')) { throw 'NORMALIZER_FAILURE_JSON_INVALID' }
              [System.Text.Json.JsonElement]$statusElement = [System.Text.Json.JsonElement]::new()
              [System.Text.Json.JsonElement]$codeElement = [System.Text.Json.JsonElement]::new()
              if (-not $jsonRoot.TryGetProperty('status', [ref]$statusElement) -or -not $jsonRoot.TryGetProperty('code', [ref]$codeElement) -or $statusElement.ValueKind -ne [System.Text.Json.JsonValueKind]::String -or $statusElement.GetString() -cne 'failed' -or $codeElement.ValueKind -ne [System.Text.Json.JsonValueKind]::String) { throw 'NORMALIZER_FAILURE_JSON_INVALID' }
              $allowedCodes = @{
                2 = [System.Collections.Generic.HashSet[string]]::new([string[]]@('WINDOWS_LOGON_PE_EVIDENCE_ARGUMENT_INVALID', 'WINDOWS_LOGON_PE_EVIDENCE_HELPER_INVALID', 'WINDOWS_LOGON_PE_EVIDENCE_HELPER_SIZE_INVALID', 'WINDOWS_LOGON_PE_EVIDENCE_EVIDENCE_INVALID', 'WINDOWS_LOGON_PE_EVIDENCE_EVIDENCE_SIZE_INVALID', 'WINDOWS_LOGON_PE_EVIDENCE_EVIDENCE_DUPLICATE'), [System.StringComparer]::Ordinal)
                3 = [System.Collections.Generic.HashSet[string]]::new([string[]]@('WINDOWS_LOGON_PE_EVIDENCE_SHA_MISMATCH'), [System.StringComparer]::Ordinal)
                4 = [System.Collections.Generic.HashSet[string]]::new([string[]]@('WINDOWS_LOGON_PE_EVIDENCE_HEADERS_INVALID', 'WINDOWS_LOGON_PE_EVIDENCE_ARCHITECTURE_INVALID', 'WINDOWS_LOGON_PE_EVIDENCE_PE_FORMAT_INVALID', 'WINDOWS_LOGON_PE_EVIDENCE_IMAGE_KIND_INVALID', 'WINDOWS_LOGON_PE_EVIDENCE_MITIGATION_MISSING', 'WINDOWS_LOGON_PE_EVIDENCE_DEPENDENTS_INVALID', 'WINDOWS_LOGON_PE_EVIDENCE_IMPORTS_INVALID', 'WINDOWS_LOGON_PE_EVIDENCE_LOADCONFIG_INVALID'), [System.StringComparer]::Ordinal)
                7 = [System.Collections.Generic.HashSet[string]]::new([string[]]@('WINDOWS_LOGON_PE_EVIDENCE_UNEXPECTED'), [System.StringComparer]::Ordinal)
              }
              $normalizerFailureCode = $codeElement.GetString()
              if (-not $allowedCodes.ContainsKey($expectedExitCode) -or -not $allowedCodes[$expectedExitCode].Contains($normalizerFailureCode)) { throw 'NORMALIZER_FAILURE_EXIT_CODE_MISMATCH' }
              return $normalizerFailureCode
            } finally { if ($null -ne $document) { $document.Dispose() } }
          }
          if ($normalizerExitCode -ne 0) {
            if ($normalizerStdout.Length -ne 0) { throw 'NORMALIZER_FAILURE_STDOUT_NONEMPTY' }
            if ($normalizerStderr.Length -eq 0) { throw 'NORMALIZER_FAILURE_STDERR_INVALID' }
            $normalizerFailureLines = @($normalizerStderr -split "`r?`n" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($normalizerFailureLines.Count -ne 1) { throw 'NORMALIZER_FAILURE_JSON_INVALID' }
            $normalizerFailureCode = Assert-NormalizerFailureJson $normalizerFailureLines[0] ([Int32]$normalizerExitCode)
            Write-Output "4A3_NORMALIZER_FAILURE_CODE=$normalizerFailureCode"
            throw $normalizerFailureCode
          }
          if ($normalizerStderr.Length -ne 0) { throw 'NORMALIZER_STDERR_NONEMPTY' }
          if ($normalizerStdout.Length -eq 0) { throw 'NORMALIZER_STDOUT_INVALID' }
          $normalizerLines = @($normalizerStdout -split "`r?`n" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($normalizerLines.Count -ne 1) { throw 'NORMALIZED_JSON_INVALID' }
          function Assert-NormalizedEvidenceJson([string]$jsonText, [string]$expectedCommit, [string]$expectedSha256, [Int64]$expectedHelperSize) {
            $document = $null
            try {
              try { $document = [System.Text.Json.JsonDocument]::Parse($jsonText) } catch { throw 'NORMALIZED_JSON_INVALID' }
            $jsonRoot = $document.RootElement
            if ($jsonRoot.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) { throw 'NORMALIZED_ROOT_SCHEMA_INVALID' }
            $expectedProperties = [string[]]@('status', 'phase', 'sourceCommit', 'helperBasename', 'helperSha256', 'helperSizeBytes', 'machine', 'peFormat', 'imageKind', 'subsystem', 'dynamicBase', 'nxCompat', 'guardCf', 'directDependencies', 'importLibraries', 'delayLoadLibraries', 'dependencyPolicy', 'allowlistApplied')
            $expectedPropertySet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            $seenProperties = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            foreach ($propertyName in $expectedProperties) { [void]$expectedPropertySet.Add($propertyName) }
            $propertyCount = 0
            foreach ($property in $jsonRoot.EnumerateObject()) {
              $propertyCount += 1
              if (-not $expectedPropertySet.Contains($property.Name)) { throw 'NORMALIZED_PROPERTY_SET_INVALID' }
              if (-not $seenProperties.Add($property.Name)) { throw 'NORMALIZED_PROPERTY_DUPLICATE' }
            }
            if ($propertyCount -ne $expectedProperties.Length) { throw 'NORMALIZED_PROPERTY_SET_INVALID' }
            foreach ($propertyName in $expectedProperties) { if (-not $seenProperties.Contains($propertyName)) { throw 'NORMALIZED_PROPERTY_MISSING' } }
            function Get-RequiredJsonElement([System.Text.Json.JsonElement]$object, [string]$name) {
              [System.Text.Json.JsonElement]$element = [System.Text.Json.JsonElement]::new()
              if (-not $object.TryGetProperty($name, [ref]$element)) { throw 'NORMALIZED_JSON_SCHEMA_INVALID' }
              return $element
            }
            function Get-ExactJsonString([System.Text.Json.JsonElement]$object, [string]$name, [string]$expected, [string]$failureCode) {
              $element = Get-RequiredJsonElement $object $name
              if ($element.ValueKind -ne [System.Text.Json.JsonValueKind]::String -or $element.GetString() -cne $expected) { throw $failureCode }
              return $element.GetString()
            }
            function Get-ExactJsonBoolean([System.Text.Json.JsonElement]$object, [string]$name, [bool]$expected, [string]$failureCode) {
              $element = Get-RequiredJsonElement $object $name
              $expectedKind = if ($expected) { [System.Text.Json.JsonValueKind]::True } else { [System.Text.Json.JsonValueKind]::False }
              if ($element.ValueKind -ne $expectedKind) { throw $failureCode }
              return $expected
            }
            function Get-JsonDllArray([System.Text.Json.JsonElement]$object, [string]$name, [bool]$nonEmpty) {
              $element = Get-RequiredJsonElement $object $name
              if ($element.ValueKind -ne [System.Text.Json.JsonValueKind]::Array) { throw 'NORMALIZED_DEPENDENCIES_INVALID' }
              $values = [System.Collections.Generic.List[string]]::new(); $seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal); $previous = $null
              foreach ($item in $element.EnumerateArray()) {
                if ($item.ValueKind -ne [System.Text.Json.JsonValueKind]::String) { throw 'NORMALIZED_DEPENDENCIES_INVALID' }
                $value = $item.GetString()
                if ($value -cnotmatch '^[a-z0-9._-]+\.dll$' -or -not $seen.Add($value) -or ($null -ne $previous -and [System.StringComparer]::Ordinal.Compare($previous, $value) -ge 0)) { throw 'NORMALIZED_DEPENDENCIES_INVALID' }
                $values.Add($value); $previous = $value
              }
              if ($nonEmpty -and $values.Count -eq 0) { throw 'NORMALIZED_DEPENDENCIES_INVALID' }
              return $values.ToArray()
            }
            $status = Get-ExactJsonString $jsonRoot 'status' 'passed' 'NORMALIZED_IDENTITY_INVALID'
            $phase = Get-ExactJsonString $jsonRoot 'phase' 'c2a-pe-dependency-evidence' 'NORMALIZED_IDENTITY_INVALID'
            $sourceCommit = Get-ExactJsonString $jsonRoot 'sourceCommit' $expectedCommit 'NORMALIZED_IDENTITY_INVALID'
            $helperBasename = Get-ExactJsonString $jsonRoot 'helperBasename' 'windows-logon-session-snapshot-helper.exe' 'NORMALIZED_HELPER_INVALID'
            $helperSha256 = Get-ExactJsonString $jsonRoot 'helperSha256' $expectedSha256 'NORMALIZED_HELPER_INVALID'
            $machine = Get-ExactJsonString $jsonRoot 'machine' 'AMD64' 'NORMALIZED_PE_INVALID'
            $peFormat = Get-ExactJsonString $jsonRoot 'peFormat' 'PE32+' 'NORMALIZED_PE_INVALID'
            $imageKind = Get-ExactJsonString $jsonRoot 'imageKind' 'executable' 'NORMALIZED_PE_INVALID'
            if ($sourceCommit -cnotmatch '^[a-f0-9]{40}$' -or $helperSha256 -cnotmatch '^[a-f0-9]{64}$') { throw 'NORMALIZED_IDENTITY_INVALID' }
            $sizeElement = Get-RequiredJsonElement $jsonRoot 'helperSizeBytes'; [Int64]$helperSizeBytes = 0
            if ($sizeElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Number -or -not $sizeElement.TryGetInt64([ref]$helperSizeBytes) -or $helperSizeBytes -le 0 -or $helperSizeBytes -gt (16 * 1024 * 1024) -or $helperSizeBytes -ne $expectedHelperSize) { throw 'NORMALIZED_HELPER_INVALID' }
            $dynamicBase = Get-ExactJsonBoolean $jsonRoot 'dynamicBase' $true 'NORMALIZED_MITIGATION_INVALID'
            $nxCompat = Get-ExactJsonBoolean $jsonRoot 'nxCompat' $true 'NORMALIZED_MITIGATION_INVALID'
            $guardCf = Get-ExactJsonBoolean $jsonRoot 'guardCf' $true 'NORMALIZED_MITIGATION_INVALID'
            $allowlistApplied = Get-ExactJsonBoolean $jsonRoot 'allowlistApplied' $false 'NORMALIZED_POLICY_INVALID'
            $directDependencies = Get-JsonDllArray $jsonRoot 'directDependencies' $true
            $importLibraries = Get-JsonDllArray $jsonRoot 'importLibraries' $true
            $delayLoadLibraries = Get-JsonDllArray $jsonRoot 'delayLoadLibraries' $false
            $dependencyPolicy = Get-ExactJsonString $jsonRoot 'dependencyPolicy' 'evidence-only' 'NORMALIZED_POLICY_INVALID'
            $subsystemElement = Get-RequiredJsonElement $jsonRoot 'subsystem'
            if ($subsystemElement.ValueKind -ne [System.Text.Json.JsonValueKind]::String) { throw 'NORMALIZED_JSON_SCHEMA_INVALID' }
            $subsystem = $subsystemElement.GetString()
            if ($subsystem -cnotmatch '^[A-Z0-9_]{1,64}$') { throw 'NORMALIZED_JSON_SCHEMA_INVALID' }
              return [PSCustomObject]@{ SourceCommit = $sourceCommit; HelperBasename = $helperBasename; HelperSha256 = $helperSha256; HelperSizeBytes = $helperSizeBytes; Machine = $machine; PeFormat = $peFormat; ImageKind = $imageKind; Subsystem = $subsystem; DynamicBase = $dynamicBase; NxCompat = $nxCompat; GuardCf = $guardCf; DirectDependencies = @($directDependencies); ImportLibraries = @($importLibraries); DelayLoadLibraries = @($delayLoadLibraries) }
            } finally { if ($null -ne $document) { $document.Dispose() } }
          }
          $normalized = Assert-NormalizedEvidenceJson $normalizerLines[0] $expectedCommit $powershellSha256 ([Int64]$helperSize)
          $sourceCommit = $normalized.SourceCommit; $helperBasename = $normalized.HelperBasename; $helperSha256 = $normalized.HelperSha256; $helperSizeBytes = $normalized.HelperSizeBytes
          $machine = $normalized.Machine; $peFormat = $normalized.PeFormat; $imageKind = $normalized.ImageKind; $subsystem = $normalized.Subsystem
          $dynamicBase = $normalized.DynamicBase; $nxCompat = $normalized.NxCompat; $guardCf = $normalized.GuardCf
          $directDependencies = $normalized.DirectDependencies; $importLibraries = $normalized.ImportLibraries; $delayLoadLibraries = $normalized.DelayLoadLibraries
          Write-Output "4A3_SOURCE_COMMIT=$sourceCommit"
          Write-Output "4A3_HELPER_BASENAME=$helperBasename"
          Write-Output "4A3_HELPER_SIZE_BYTES=$helperSizeBytes"
          Write-Output "4A3_HELPER_SHA256=$helperSha256"
          $summary = @(
            '## C2-A PE and dependency evidence',
            "- Source commit: $sourceCommit",
            "- Helper basename: $helperBasename",
            "- Helper SHA-256: $helperSha256",
            "- Helper size bytes: $helperSizeBytes",
            "- Machine: $machine",
            "- PE format: $peFormat",
            "- Image kind: $imageKind",
            "- Subsystem: $subsystem",
            "- DYNAMICBASE: $dynamicBase",
            "- NXCOMPAT: $nxCompat",
            "- Guard CF: $guardCf",
            "- Direct dependencies: $($directDependencies -join ', ')",
            "- Import libraries: $($importLibraries -join ', ')",
            "- Delay-load libraries: $($delayLoadLibraries -join ', ')",
            '- Dependency policy: evidence-only; no DLL allowlist applied.',
            '- Helper execution: not performed.',
            '- Artifact upload: not performed.',
            '- Dependencies have not been allowlisted.'
          )
          $summary -join "`n" | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Assert evidence-only completion
        shell: pwsh
        run: |
          Write-Output 'C2-A assertion: artifacts are not uploaded and the helper was not executed.'
